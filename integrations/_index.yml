# IBM integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in ibm-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: ibm-servicenow
  label: Open a ServiceNow incident when an IBM Cloud service ID is created
  partner: servicenow
  category: ITSM
  use_case: When a new IBM Cloud IAM Service ID is provisioned, automatically open a ServiceNow incident ticket
    so the platform team can audit, classify, and approve the workload identity.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-splunk
  label: Stream IBM Cloud IAM policy changes into Splunk
  partner: splunk
  category: Observability
  use_case: Forward IBM Cloud IAM Policy create/update/delete events to Splunk HEC so the SecOps team can detect
    privilege escalation across IBM Cloud, watsonx, and API Connect.
  source: curated
  status: not-a-workflow
  evidence: https://splunkbase.splunk.com/app/7568/
  type: marketplace
  arazzo: null
- slug: ibm-slack
  label: Alert Slack on IBM Cloud IAM API key creation
  partner: slack
  category: Notifications
  use_case: Post a Slack message when an IBM Cloud IAM API key is created, locked, or disabled so platform engineers
    can act on suspicious credential activity without leaving chat.
  source: curated
  status: not-a-workflow
  evidence: https://slack.com/marketplace/A03JXC6JM8S-ibm-video-streaming
  type: marketplace
  arazzo: null
- slug: ibm-github
  label: Rotate IBM Cloud IAM API keys from a GitHub Actions workflow
  partner: github
  category: DevOps
  use_case: Drive scheduled IBM Cloud IAM API key rotation from a GitHub Actions workflow — create a new key, write
    it to a GitHub Actions secret, then disable the old one.
  source: curated
  status: not-a-workflow
  evidence: https://github.com/marketplace/power-z-gha-runner
  type: marketplace
  arazzo: null
- slug: ibm-anthropic
  label: Complement watsonx with Anthropic Claude via shared IBM Cloud identity
  partner: anthropic
  category: AI
  use_case: Mint an IBM Cloud IAM token for watsonx access, then hand control to Anthropic Claude for tasks where
    Claude is the stronger model — letting agents fluidly route between watsonx.ai and Claude under one identity.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-kafka
  label: Gate IBM Event Streams (Kafka) producers with IAM trusted profiles
  partner: kafka
  category: Streaming
  use_case: Issue a short-lived IBM Cloud IAM trusted-profile token, then use it to authorize an Event Streams (Kafka)
    producer call — so workloads outside IBM Cloud can publish to Event Streams without long-lived keys.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: ibm-snowflake
  label: Federate IBM Cloud workloads into Snowflake via IAM service IDs
  partner: snowflake
  category: Data warehouse
  use_case: Provision an IBM Cloud IAM Service ID + policy to read from Cloud Object Storage, then register that
    identity as a Snowflake external stage so warehouse pipelines pull from IBM-hosted data with no shared secrets.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-tableau
  label: Embed IBM Cloud cost + IAM posture in Tableau dashboards
  partner: tableau
  category: BI
  use_case: Pull IBM Cloud IAM roles and policy inventory and publish them as a Tableau data source so FinOps and
    SecOps can see entitlement sprawl alongside spend.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-salesforce
  label: Link IBM Cloud accounts to Salesforce as customer entitlements
  partner: salesforce
  category: CRM
  use_case: When an IBM Cloud IAM Service ID is provisioned for a customer environment, mirror it into Salesforce
    as a custom Entitlement record on the matching Account so CSMs can see live IBM Cloud usage in CRM.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-sap
  label: Authorize SAP S/4HANA jobs against IBM Cloud IAM trusted profiles
  partner: sap
  category: ERP
  use_case: When an SAP S/4HANA batch job needs to read from IBM Cloud Object Storage or watsonx.data, exchange
    an SAP Cloud Identity assertion for an IBM Cloud trusted-profile token instead of provisioning a long-lived
    API key.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-workday
  label: Drive IBM Cloud IAM lifecycle from Workday joiner / mover / leaver events
  partner: workday
  category: HCM
  use_case: When Workday emits a worker termination event, automatically lock and then delete the matching IBM Cloud
    IAM API keys so departing employees lose IBM Cloud access on day one.
  source: curated
  status: pending-generation
  arazzo: null
- slug: ibm-power-bi
  label: Surface IBM Cloud IAM posture in Microsoft Power BI
  partner: power-bi
  category: BI
  use_case: Push IBM Cloud IAM policy and service-ID inventory into a Power BI streaming dataset so CISOs can monitor
    IBM Cloud entitlement drift inside the same Power BI workspace they already use for Microsoft 365.
  source: curated
  status: pending-generation
  arazzo: null
