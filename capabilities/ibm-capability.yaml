  - type: mcp
    port: 9090
    namespace: ibm-mcp
    transport: http
    description: MCP adapter for IBM Cloud IAM API for AI agent use.
    tools:
    - name: createaccesstoken
      description: Create an IAM access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ibm.createaccesstoken
      outputParameters:
      - type: object
        mapping: $.
    - name: listapikeys
      description: List API keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ibm.listapikeys
      with:
        account_id: tools.account_id
        iam_id: tools.iam_id
        pagesize: tools.pagesize
        pagetoken: tools.pagetoken
        scope: tools.scope
        type: tools.type
        sort: tools.sort
        order: tools.order
      inputParameters:
      - name: account_id
        type: string
        description: The account ID of the API keys to query.
      - name: iam_id
        type: string
        description: The IAM ID associated with the API keys.
      - name: pagesize
        type: integer
        description: Number of results per page.
      - name: pagetoken
        type: string
        description: Page token from a previous request for pagination.
      - name: scope
