"""
IBM Cloud + Watson GraphQL Schema
Covers Watson AI services, IBM Cloud infrastructure, IAM, storage, databases,
networking, observability, and enterprise management.
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Upload

# ─── Enums ────────────────────────────────────────────────────────────────────

enum ResourceState {
  ACTIVE
  INACTIVE
  PENDING
  FAILED
  PROVISIONING
  DEPROVISIONING
  REMOVED
}

enum IAMPolicyType {
  ACCESS
  AUTHORIZATION
  SERVICE_TO_SERVICE
}

enum NetworkProtocol {
  TCP
  UDP
  ICMP
  ALL
}

enum LoadBalancerAlgorithm {
  ROUND_ROBIN
  WEIGHTED_ROUND_ROBIN
  LEAST_CONNECTIONS
}

enum DatabaseType {
  POSTGRESQL
  MONGODB
  REDIS
  ELASTICSEARCH
  DB2
  CLOUDANT
}

enum ModelFamily {
  GRANITE
  LLAMA
  MISTRAL
  CODELLAMA
  FLAN_T5
  MPT
}

