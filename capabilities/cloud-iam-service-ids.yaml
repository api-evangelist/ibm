    resources:
    - name: v1-serviceids
      path: /v1/serviceids/
      operations:
      - name: listserviceids
        method: GET
        description: List service IDs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_id
          in: query
          type: string
          description: The account ID of the service IDs to query.
        - name: name
          in: query
          type: string
          description: Filter service IDs by name.
        - name: pagesize
          in: query
          type: integer
          description: Number of results per page.
        - name: pagetoken
          in: query
          type: string
          description: Page token from a previous request for pagination.
        - name: sort
          in: query
          type: string
          description: Field to sort results by.
        - name: order
          in: query
          type: string
          description: Sort order.
      - name: createserviceid
        method: POST
        description: Create a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-serviceids-id
      path: /v1/serviceids/{id}
      operations:
      - name: getserviceid
        method: GET
        description: Get a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: include_history
          in: query
          type: boolean
          description: Include the history of the service ID.
        - name: include_activity
          in: query
          type: boolean
          description: Include the activity of the service ID.
      - name: updateserviceid
        method: PUT
        description: Update a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteserviceid
        method: DELETE
        description: Delete a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-serviceids-id-lock
      path: /v1/serviceids/{id}/lock
      operations:
      - name: lockserviceid
        method: POST
        description: Lock a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: unlockserviceid
        method: DELETE
        description: Unlock a service ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.IBM_API_KEY}}'
  exposes:
