naftiko: 1.0.0-alpha2
info:
  label: Embed IBM Cloud cost + IAM posture in Tableau dashboards
  description: Pull IBM Cloud IAM roles and policy inventory and publish them as a Tableau data source so FinOps and SecOps can see entitlement sprawl alongside spend.
  tags:
  - IBM
  - Integration
  - BI
  - tableau
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    IBM_API_KEY: IBM_API_KEY
    TABLEAU_API_KEY: TABLEAU_API_KEY
capability:
  consumes:
  - type: http
    namespace: ibm
    baseUri: https://cloud.ibm.com
    description: IBM API operations consumed by this integration.
    resources:
    - name: v2-roles
      path: /v2/roles
      operations:
      - name: listroles
        method: GET
        description: List IBM Cloud IAM custom and system roles to expose in Tableau.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    - name: v1-policies
      path: /v1/policies
      operations:
      - name: listpolicies
        method: GET
        description: List IBM Cloud IAM policies so dashboards can chart entitlement breadth per account.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
  - type: http
    namespace: tableau
    baseUri: https://yourpod.online.tableau.com
    description: Tableau REST API operations consumed by this integration.
    resources:
    - name: api-3-21-sites-site-id-datasources
      path: /api/3.21/sites/{site_id}/datasources
      operations:
      - name: publishdatasource
        method: POST
        description: 'Tableau REST API: publishDataSource'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: site_id
          in: path
          type: string
          description: Path parameter site_id.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: ibm-tableau-mcp
    description: MCP adapter for the ibm-tableau integration.
    tools:
    - name: ibm_tableau
      description: Execute the ibm tableau integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: ibm-tableau-rest
    port: 8080
    description: REST adapter for the ibm-tableau integration.
    resources:
    - path: /ibm-tableau
      name: ibm-tableau
      description: REST surface for the ibm-tableau integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the ibm-tableau integration.
        call: ibm_tableau
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
