      - type: object
        mapping: $.
    - name: update-api-key
      description: Update an API key
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloud-iam-api-keys.updateapikey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-api-key
      description: Delete an API key
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-iam-api-keys.deleteapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: disable-api-key
      description: Disable an API key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-iam-api-keys.disableapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: enable-api-key
