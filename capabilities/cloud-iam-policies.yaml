naftiko: 1.0.0-alpha2
info:
  label: IBM Cloud IAM API — Policies
  description: 'IBM Cloud IAM API — Policies. 6 operations. Lead operation: List access policies. Self-contained Naftiko capability
    covering one Ibm business surface.'
  tags:
  - Ibm
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    IBM_API_KEY: IBM_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-iam-policies
    baseUri: https://iam.cloud.ibm.com
    description: IBM Cloud IAM API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: v1-policies
      path: /v1/policies
      operations:
      - name: listpolicies
        method: GET
        description: List access policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_id
          in: query
          type: string
          description: The account ID to list policies for.
          required: true
        - name: iam_id
          in: query
          type: string
          description: Filter by the IAM ID of the subject.
        - name: access_group_id
          in: query
          type: string
          description: Filter by access group ID.
        - name: type
          in: query
          type: string
          description: Filter by policy type.
        - name: service_type
          in: query
          type: string
          description: Filter by service type.
        - name: state
          in: query
          type: string
          description: Filter by policy state.
        - name: limit
          in: query
          type: integer
          description: Maximum number of policies to return.
        - name: start
          in: query
          type: string
          description: Pagination start token.
      - name: createpolicy
        method: POST
        description: Create an access policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-policies-policy_id
      path: /v1/policies/{policy_id}
      operations:
      - name: getpolicy
        method: GET
        description: Get an access policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: replacepolicy
        method: PUT
        description: Replace an access policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletepolicy
        method: DELETE
        description: Delete an access policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatepolicystate
        method: PATCH
        description: Update policy state
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.IBM_API_KEY}}'
  exposes:
